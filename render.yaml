services:
  - type: web
    name: global-ai-solutions-site
    runtime: node
    plan: free
    rootDir:
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: BACKEND_URL
        value: https://global-ai-solutions-backend.onrender.com

  - type: web
    name: global-ai-solutions-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: global-ai-solutions-db
          property: connectionString
      - key: DATABASE_URL_SYNC
        fromDatabase:
          name: global-ai-solutions-db
          property: connectionString
      - key: DEFAULT_AI_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://global-ai-solutions-site.onrender.com

databases:
  - name: global-ai-solutions-db
    plan: free
