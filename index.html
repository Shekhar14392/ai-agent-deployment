<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Global AI Solutions</title>
<style>
  :root{--ink:#14171F;--ink-2:#1D212C;--paper:#F6F4EF;--amber:#FFB020;--teal:#2DD4BF;--slate:#8B93A7;--danger:#FF6B6B;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--ink);color:var(--paper);font-family:-apple-system,Inter,sans-serif;}
  .wrap{max-width:1000px;margin:0 auto;padding:24px;}
  h1{font-size:22px;margin-bottom:4px;}
  .sub{color:var(--slate);font-size:13px;margin-bottom:24px;}
  #loginBox{max-width:380px;margin:80px auto;background:var(--ink-2);padding:30px;border-radius:14px;border:1px solid rgba(255,255,255,.08);}
  input,select{width:100%;background:var(--ink);border:1px solid rgba(255,255,255,.15);color:var(--paper);padding:11px 13px;border-radius:8px;margin-bottom:12px;font-size:14px;}
  button{background:var(--amber);color:var(--ink);border:none;font-weight:600;padding:11px 18px;border-radius:8px;cursor:pointer;font-size:14px;}
  button:hover{filter:brightness(1.05);}
  button.ghost{background:transparent;border:1px solid rgba(255,255,255,.2);color:var(--paper);}
  table{width:100%;border-collapse:collapse;margin-top:10px;}
  th,td{text-align:left;padding:10px 12px;font-size:13.5px;border-bottom:1px solid rgba(255,255,255,.07);}
  th{color:var(--slate);font-weight:500;text-transform:uppercase;font-size:11px;letter-spacing:.05em;}
  .status-pill{padding:3px 9px;border-radius:100px;font-size:11.5px;font-family:monospace;}
  .pending{background:rgba(255,176,32,.15);color:var(--amber);}
  .approved,.paid{background:rgba(45,212,191,.15);color:var(--teal);}
  .rejected{background:rgba(255,107,107,.15);color:var(--danger);}
  .panel{background:var(--ink-2);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:22px;margin-bottom:20px;}
  #error{color:var(--danger);font-size:13px;margin-top:8px;display:none;}
  .actions button{margin-right:6px;padding:5px 10px;font-size:12px;}
  #topbar{display:flex;justify-content:space-between;align-items:center;}
</style>
</head>
<body>

<div id="loginBox">
  <h1>Admin login</h1>
  <p class="sub">Sign in with your admin account.</p>
  <input id="email" type="email" placeholder="admin@yourbusiness.com">
  <input id="password" type="password" placeholder="Password">
  <button style="width:100%" onclick="login()">Sign in</button>
  <div id="error"></div>
</div>

<div class="wrap" id="dashboard" style="display:none">
  <div id="topbar">
    <div>
      <h1>Admin dashboard</h1>
      <p class="sub">Global AI Solutions — control panel</p>
    </div>
    <button class="ghost" onclick="logout()">Log out</button>
  </div>

  <div class="panel">
    <h2 style="font-size:15px;margin-bottom:12px;">Withdrawal requests</h2>
    <table>
      <thead><tr><th>User</th><th>Amount</th><th>Method</th><th>Status</th><th>Requested</th><th>Actions</th></tr></thead>
      <tbody id="withdrawalRows"><tr><td colspan="6" style="color:var(--slate)">Loading…</td></tr></tbody>
    </table>
  </div>
</div>

<script>
// Same-domain deployment (self-hosted via Nginx) — no change needed.
// If your API is on a different domain, replace with the full URL.
const API_BASE = "/api/v1";
let accessToken = localStorage.getItem('gai_admin_token') || null;

async function login(){
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('error');
  errEl.style.display = 'none';
  try{
    const res = await fetch(`${API_BASE}/auth/login`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if(!res.ok){ throw new Error(data.detail || 'Login failed'); }

    // Verify this account is actually an admin before granting dashboard access
    const meRes = await fetch(`${API_BASE}/auth/me`, { headers: { Authorization: `Bearer ${data.access_token}` }});
    const me = await meRes.json();
    if(me.role !== 'admin' && me.role !== 'super_admin'){
      throw new Error('This account does not have admin access.');
    }

    accessToken = data.access_token;
    localStorage.setItem('gai_admin_token', accessToken);
    showDashboard();
  }catch(err){
    errEl.textContent = err.message;
    errEl.style.display = 'block';
  }
}

function logout(){
  localStorage.removeItem('gai_admin_token');
  accessToken = null;
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('loginBox').style.display = 'block';
}

async function showDashboard(){
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  await loadWithdrawals();
}

async function loadWithdrawals(){
  const res = await fetch(`${API_BASE}/wallet/admin/withdrawals`, { headers: { Authorization: `Bearer ${accessToken}` }});
  const rows = document.getElementById('withdrawalRows');
  if(!res.ok){ rows.innerHTML = '<tr><td colspan="6" style="color:var(--danger)">Could not load withdrawals — check API_BASE and admin permissions.</td></tr>'; return; }
  const data = await res.json();
  if(data.length === 0){ rows.innerHTML = '<tr><td colspan="6" style="color:var(--slate)">No withdrawal requests yet.</td></tr>'; return; }

  rows.innerHTML = data.map(w => `
    <tr>
      <td>${w.user_id.slice(0,8)}…</td>
      <td>$${Number(w.amount).toFixed(2)}</td>
      <td>${w.payout_method}</td>
      <td><span class="status-pill ${w.status}">${w.status}</span></td>
      <td>${new Date(w.created_at).toLocaleDateString()}</td>
      <td class="actions">
        ${w.status === 'pending' ? `
          <button onclick="decide('${w.id}','approved')">Approve</button>
          <button class="ghost" onclick="decide('${w.id}','rejected')">Reject</button>
        ` : '—'}
      </td>
    </tr>
  `).join('');
}

async function decide(id, status){
  await fetch(`${API_BASE}/wallet/admin/withdrawals/${id}`, {
    method: 'PATCH',
    headers: { 'Content-Type':'application/json', Authorization: `Bearer ${accessToken}` },
    body: JSON.stringify({ status })
  });
  await loadWithdrawals();
}

if(accessToken) showDashboard();
</script>
</body>
</html>
